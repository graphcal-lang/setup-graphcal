[project]
name = "setup-graphcal"
# Not a published package: releases are the v1.x.y git tags.
version = "0.0.0"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]

# The action runs with whatever Python the runner provides (no installs), so
# setup_graphcal/ must stay standard-library only and support Python 3.10
# (the system Python of ubuntu-22.04). Raise to 3.12 once ubuntu-22.04 runners
# are retired (2027-04-17, actions/runner-images#14254).
# The dependencies above are development tools.

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "PT"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ty.environment]
python-version = "3.10"
